
[functions.livekit-token]
enabled = true
verify_jwt = true   # the function also checks the user itself; never turn this off for livekit-token
import_map = "./functions/livekit-token/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/livekit-token/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/livekit-token/*.html" ]

[functions.livekit-webhook]
enabled = true
# LiveKit signs its own requests; this function checks that signature instead of a Supabase login
verify_jwt = false
entrypoint = "./functions/livekit-webhook/index.ts"

[functions.push-notify]
enabled = true
# Called by Supabase Database Webhooks, which have no user login; the x-webhook-secret header is the check instead
verify_jwt = false
entrypoint = "./functions/push-notify/index.ts"
